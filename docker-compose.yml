version: '3.4'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SA_PASSWORD}
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SA_PASSWORD}", "-Q", "SELECT 1", "-No"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  gateway.api:
    image: ${DOCKER_REGISTRY-}gatewayapi
    build:
      context: .
      dockerfile: Gateway.Api/Dockerfile
    depends_on:
      - identityservice.api
      - tasksservice.api

  identityservice.api:
    image: ${DOCKER_REGISTRY-}identityserviceapi
    build:
      context: .
      dockerfile: IdentityService.Api/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy

  tasksservice.api:
    image: ${DOCKER_REGISTRY-}tasksserviceapi
    build:
      context: .
      dockerfile: TasksService.Api/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqlserver_data: